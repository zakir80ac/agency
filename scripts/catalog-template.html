<title>Agency Roster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a staffing roster — filter rail on the left, a sheet of hireable specialists on the right, a file-card dialog for each one. */
:root {
  --paper: #f5f6f4;
  --sheet: #ffffff;
  --ink: #1b2420;
  --muted: #5d6a64;
  --rule: #dfe4e1;
  --accent: #1f6b4f;
  --accent-ink: #ffffff;
  --accent-soft: #e3efe9;
  --shadow: 0 10px 40px rgba(20, 40, 30, .18);
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121715; --sheet: #1a211e; --ink: #e6ece9; --muted: #9aa8a1; --rule: #2c3632;
    --accent: #5fc19a; --accent-ink: #0c1411; --accent-soft: #1f3129; --shadow: 0 10px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121715; --sheet: #1a211e; --ink: #e6ece9; --muted: #9aa8a1; --rule: #2c3632;
  --accent: #5fc19a; --accent-ink: #0c1411; --accent-soft: #1f3129; --shadow: 0 10px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--font-body);
}
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
header { display: grid; gap: 14px; margin-bottom: 22px; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(28px, 4vw, 40px)/1.05 var(--font-display); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.searchbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
#q {
  flex: 1 1 320px; min-width: 0; font: 500 16px var(--font-body); color: var(--ink);
  background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 10px; padding: 12px 14px;
}
#q:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hints { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.hint { font: 500 13px var(--font-body); color: var(--accent); background: none; border: 0; padding: 2px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 22px; max-height: calc(100vh - 32px); overflow: auto; padding-right: 4px; }
aside h2 { font: 700 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.filter-list { display: grid; gap: 2px; }
.f {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  font: 500 14px var(--font-body); color: var(--ink); background: none; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer;
}
.f:hover { background: var(--accent-soft); }
.f[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.f .n { margin-left: auto; font: 400 12px var(--font-mono); opacity: .75; font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.status { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.count { font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.team-banner { background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; display: grid; gap: 8px; }
.team-banner h3 { margin: 0; font: 700 18px var(--font-display); }
.team-banner p { margin: 0; color: var(--muted); }
.cmd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
code.inline { font: 13px var(--font-mono); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card {
  display: grid; grid-template-rows: auto auto 1fr; gap: 6px; text-align: left; min-width: 0;
  background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; cursor: pointer;
  font: inherit; transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card .top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.card .emoji { font-size: 22px; line-height: 1; }
.card .name { font: 700 16px/1.2 var(--font-display); }
.card .div { display: flex; align-items: center; gap: 6px; font: 400 12px var(--font-mono); color: var(--muted); }
.card .desc { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.empty { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--rule); border-radius: 12px; }
.btn {
  font: 600 14px var(--font-body); border-radius: 8px; padding: 9px 14px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--accent);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
dialog {
  width: min(860px, calc(100vw - 24px)); max-height: calc(100vh - 32px); padding: 0;
  border: 1px solid var(--rule); border-radius: 14px; background: var(--sheet); color: var(--ink); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 20, 15, .45); }
.dlg { display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: calc(100vh - 34px); }
.dlg-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--rule); display: grid; gap: 10px; }
.dlg-title { display: flex; align-items: flex-start; gap: 12px; }
.dlg-title .emoji { font-size: 30px; line-height: 1; }
.dlg-title h2 { margin: 0; font: 800 24px/1.15 var(--font-display); text-wrap: balance; }
.dlg-title .vibe { margin: 4px 0 0; color: var(--muted); font-style: italic; }
.close { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.close:focus-visible { outline: 3px solid var(--accent); }
.dlg-desc { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.meta { font: 12px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.toast { font: 500 13px var(--font-body); color: var(--accent); min-height: 1em; }
.dlg-body { overflow: auto; padding: 18px 22px 24px; }
.dlg-body pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 var(--font-mono); color: var(--ink); }
.mobile-filters { display: none; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside { display: none; }
  .mobile-filters { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-bottom: 14px; }
  .mobile-filters select { width: 100%; min-width: 0; font: 500 14px var(--font-body); color: var(--ink); background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 8px; padding: 9px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">The Agency · open-source AI specialists</span>
    <h1>Agency Roster</h1>
    <p class="lede" id="lede">Find the AI specialist for the job. Search by the problem you have, filter by team or department, then copy the agent's instructions into Claude or install it with one command.</p>
    <div class="searchbar">
      <input id="q" type="search" placeholder="Try “unpaid invoices”, “hire a salesperson”, “Instagram”…" aria-label="Search agents" autocomplete="off">
    </div>
    <div class="hints" id="hints"><span>Popular:</span></div>
  </header>

  <div class="mobile-filters">
    <select id="m-team" aria-label="Team bundle"></select>
    <select id="m-div" aria-label="Department"></select>
  </div>

  <div class="layout">
    <aside>
      <section><h2>Ready-made teams</h2><div class="filter-list" id="teams"></div></section>
      <section><h2>Departments</h2><div class="filter-list" id="divs"></div></section>
    </aside>
    <main>
      <div id="banner"></div>
      <div class="status"><span class="count" id="count"></span></div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<dialog id="dlg" aria-labelledby="d-name">
  <div class="dlg">
    <div class="dlg-head">
      <div class="dlg-title">
        <span class="emoji" id="d-emoji"></span>
        <div><h2 id="d-name"></h2><p class="vibe" id="d-vibe"></p></div>
        <button class="close" id="d-close" aria-label="Close">×</button>
      </div>
      <p class="dlg-desc" id="d-desc"></p>
      <div class="actions">
        <button class="btn" id="d-copy">Copy instructions</button>
        <button class="btn ghost" id="d-copy-cmd">Copy install command</button>
        <span class="toast" id="d-toast" role="status"></span>
      </div>
      <div class="meta" id="d-meta"></div>
    </div>
    <div class="dlg-body"><pre id="d-body"></pre></div>
  </div>
</dialog>

<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const state = { q: "", div: "", team: "" };
const bySlug = Object.fromEntries(DATA.agents.map(a => [a.slug, a]));
DATA.agents.forEach(a => {
  a._name = a.name.toLowerCase();
  a._meta = (a.description + " " + a.vibe + " " + DATA.divisions[a.division].label).toLowerCase();
  a._body = a.body.toLowerCase();
});

const HINTS = ["unpaid invoices", "bookkeeping", "find new leads", "proposal", "hiring", "customer complaints", "social media", "contract review", "pricing", "SEO"];
HINTS.forEach(h => {
  const b = document.createElement("button");
  b.className = "hint"; b.textContent = h;
  b.addEventListener("click", () => { $("q").value = h; state.q = h; render(); });
  $("hints").appendChild(b);
});

function filterBtn(label, count, pressed, onClick, color) {
  const b = document.createElement("button");
  b.className = "f"; b.setAttribute("aria-pressed", String(pressed));
  if (color) { const d = document.createElement("span"); d.className = "dot"; d.style.background = color; b.appendChild(d); }
  b.appendChild(document.createTextNode(label));
  const n = document.createElement("span"); n.className = "n"; n.textContent = count; b.appendChild(n);
  b.addEventListener("click", onClick);
  return b;
}

function renderFilters() {
  const teams = $("teams"); teams.textContent = "";
  teams.appendChild(filterBtn("All agents", DATA.agents.length, !state.team, () => { state.team = ""; render(); }));
  DATA.teams.forEach(t => teams.appendChild(filterBtn(t.title.replace(/\s*\(\d+ agents\)/, ""), t.agents.length, state.team === t.id, () => { state.team = state.team === t.id ? "" : t.id; render(); })));
  const divs = $("divs"); divs.textContent = "";
  divs.appendChild(filterBtn("All departments", DATA.agents.length, !state.div, () => { state.div = ""; render(); }));
  Object.entries(DATA.divisions).forEach(([k, d]) => {
    const n = DATA.agents.filter(a => a.division === k).length;
    divs.appendChild(filterBtn(d.label, n, state.div === k, () => { state.div = state.div === k ? "" : k; render(); }, d.color));
  });
  const mt = $("m-team"), md = $("m-div");
  mt.innerHTML = ""; md.innerHTML = "";
  mt.add(new Option("All teams", ""));
  DATA.teams.forEach(t => mt.add(new Option(t.title, t.id)));
  md.add(new Option("All departments", ""));
  Object.entries(DATA.divisions).forEach(([k, d]) => md.add(new Option(d.label, k)));
  mt.value = state.team; md.value = state.div;
}
$("m-team").addEventListener("change", e => { state.team = e.target.value; render(); });
$("m-div").addEventListener("change", e => { state.div = e.target.value; render(); });

function results() {
  const STOP = new Set(["a", "an", "the", "and", "or", "for", "to", "of", "in", "on", "my", "our", "me", "i", "we", "with", "help", "find", "new", "get", "need", "want", "how", "do", "can", "someone"]);
  const raw = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const words = raw.filter(w => !STOP.has(w)).length ? raw.filter(w => !STOP.has(w)) : raw;
  const team = DATA.teams.find(t => t.id === state.team);
  let list = team ? team.agents.map(s => bySlug[s]).filter(Boolean) : DATA.agents;
  if (state.div) list = list.filter(a => a.division === state.div);
  if (!words.length) return list;
  // Match any word (plural "s" ignored); agents matching every word rank first.
  const stems = words.map(w => (w.length > 4 && w.endsWith("s") ? w.slice(0, -1) : w));
  const scored = [];
  for (const a of list) {
    let score = 0, hits = 0;
    for (const w of stems) {
      const bodyHits = a._body.split(w).length - 1;
      const s = (a._name.includes(w) ? 20 : 0) + (a._meta.includes(w) ? 8 : 0) + Math.min(bodyHits, 6);
      if (s) { hits++; score += s; }
    }
    if (hits) scored.push([score * (hits === stems.length ? 3 : 1), a]);
  }
  return scored.sort((x, y) => y[0] - x[0]).map(x => x[1]);
}

function render() {
  renderFilters();
  const team = DATA.teams.find(t => t.id === state.team);
  const banner = $("banner"); banner.textContent = "";
  if (team) {
    const box = document.createElement("div"); box.className = "team-banner";
    const h = document.createElement("h3"); h.textContent = team.title;
    const p = document.createElement("p"); p.textContent = team.summary;
    const cmd = document.createElement("div"); cmd.className = "cmd";
    const code = document.createElement("code"); code.className = "inline";
    code.textContent = "./scripts/install.sh --tool claude-code --agents-file " + team.file;
    const btn = document.createElement("button"); btn.className = "btn ghost"; btn.textContent = "Copy command";
    const toast = document.createElement("span"); toast.className = "toast"; toast.setAttribute("role", "status");
    btn.addEventListener("click", () => copy(code.textContent, toast, code));
    cmd.append(code, btn, toast); box.append(h, p, cmd); banner.appendChild(box);
  }
  const list = results();
  $("count").textContent = list.length === 1 ? "1 agent" : list.length + " agents";
  const grid = $("grid"); grid.textContent = "";
  if (!list.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = "No agents match that search. Try a broader word, such as “sales” or “finance”, or clear the filters.";
    grid.appendChild(e); return;
  }
  const frag = document.createDocumentFragment();
  for (const a of list) {
    const c = document.createElement("button"); c.className = "card"; c.type = "button";
    const top = document.createElement("div"); top.className = "top";
    const em = document.createElement("span"); em.className = "emoji"; em.textContent = a.emoji;
    const nm = document.createElement("span"); nm.className = "name"; nm.textContent = a.name;
    top.append(em, nm);
    const dv = document.createElement("div"); dv.className = "div";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = DATA.divisions[a.division].color;
    dv.append(dot, document.createTextNode(DATA.divisions[a.division].label));
    const ds = document.createElement("div"); ds.className = "desc"; ds.textContent = a.description;
    c.append(top, dv, ds);
    c.addEventListener("click", () => open(a));
    frag.appendChild(c);
  }
  grid.appendChild(frag);
}

let current = null;
function open(a) {
  current = a;
  $("d-emoji").textContent = a.emoji; $("d-name").textContent = a.name; $("d-vibe").textContent = a.vibe;
  $("d-desc").textContent = a.description; $("d-body").textContent = a.body;
  $("d-meta").textContent = DATA.divisions[a.division].label + " · " + a.path;
  $("d-toast").textContent = "";
  $("d-body").parentElement.scrollTop = 0;
  $("dlg").showModal();
}
$("d-close").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });
$("d-copy").addEventListener("click", () => copy(current.body, $("d-toast"), $("d-body"), "Instructions copied. Paste them into Claude as the first message or into a project's instructions."));
$("d-copy-cmd").addEventListener("click", () => copy("./scripts/install.sh --tool claude-code --agent " + current.slug, $("d-toast"), null, "Install command copied. Run it from the repository folder."));

function copy(text, toast, fallbackEl, okMsg) {
  const done = () => { toast.textContent = okMsg || "Copied."; };
  const fail = () => {
    if (fallbackEl) { const r = document.createRange(); r.selectNodeContents(fallbackEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast.textContent = "Copy isn't allowed here. The text is selected: press Ctrl+C (⌘C on Mac).";
  };
  try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
}

$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("lede").textContent = "Find the AI specialist for the job among " + DATA.agents.length + " agents. Search by the problem you have, filter by team or department, then copy the agent's instructions into Claude or install it with one command.";
render();
</script>
